---
# flmanbiosci.net — Authentik full-proxy (embedded outpost) → u4u-edge.
# Browser SSO required (Florida Man Bioscience | Infrastructure groups).
# Privacy + HealthKit + /api/v1/health stay public via Authentik skip_path_regex.
# Requires ReferenceGrant theswamp-to-authentik (authentik/reference-grants.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: u4u-engine
  namespace: theswamp
  annotations:
    authentik.home.arpa/enabled: "true"
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-root-https
  hostnames:
    - "flmanbiosci.net"
  rules:
    # Outpost post-auth callback can land on /if/* — bounce to product root.
    - matches:
        - path:
            type: PathPrefix
            value: /if/
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
---
# app.flmanbiosci.net — same Authentik proxy pattern (provider flmanbiosci-app).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: u4u-engine-app
  namespace: theswamp
  annotations:
    authentik.home.arpa/enabled: "true"
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "app.flmanbiosci.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /if/
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
---
# api.flmanbiosci.net → backend DIRECT (no browser SSO).
# HealthKit device tokens, scripts, and non-interactive clients use this host.
# Do not put this behind Authentik proxy mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: u4u-engine-api
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "api.flmanbiosci.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u4u-engine
          port: 8000

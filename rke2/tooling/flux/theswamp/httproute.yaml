---
# ---------------------------------------------------------------------------
# PeptOdyssey product — peptodyssey.flmanbiosci.net
# Authentik full-proxy → u4u-edge (path-split /api/v1 + frontend).
# FMB | Infrastructure groups. Public: /privacy, /peptodyssey/privacy,
# /api/v1/health, /api/v1/healthkit/*
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peptodyssey
  namespace: theswamp
  annotations:
    authentik.home.arpa/enabled: "true"
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "peptodyssey.flmanbiosci.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /if/
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
---
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: peptodyssey
  namespace: theswamp
spec:
  name: peptodyssey.flmanbiosci.net
  type: CNAME
  content: flmanbiosci.net
  proxied: true
  ttl: 1
  interval: 5m
---
# ---------------------------------------------------------------------------
# PeptOdyssey API direct — api.peptodyssey.flmanbiosci.net
# Device tokens / HealthKit / scripts. No browser SSO.
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peptodyssey-api
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "api.peptodyssey.flmanbiosci.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u4u-engine
          port: 8000
---
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: peptodyssey-api
  namespace: theswamp
spec:
  name: api.peptodyssey.flmanbiosci.net
  type: CNAME
  content: flmanbiosci.net
  proxied: true
  ttl: 1
  interval: 5m
---
# ---------------------------------------------------------------------------
# Company apex — flmanbiosci.net (PUBLIC, no Authentik)
# Serves Next frontend (marketing at /). Product paths 301 via Next middleware
# to peptodyssey.flmanbiosci.net. Legacy privacy path 301 to product /privacy.
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flmanbiosci-company
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-root-https
  hostnames:
    - "flmanbiosci.net"
  rules:
    # Frozen legacy privacy URL → product host (must stay a working redirect).
    - matches:
        - path:
            type: PathPrefix
            value: /peptodyssey/privacy
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: peptodyssey.flmanbiosci.net
            path:
              type: ReplaceFullPath
              replaceFullPath: /privacy
            statusCode: 301
    # Product tool paths → product host (middleware is backup; gateway is faster).
    - matches:
        - path:
            type: PathPrefix
            value: /jobs
        - path:
            type: PathPrefix
            value: /tracking
        - path:
            type: PathPrefix
            value: /regulatory
        - path:
            type: PathPrefix
            value: /study
        - path:
            type: PathPrefix
            value: /faq
        - path:
            type: PathPrefix
            value: /peptodyssey
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: peptodyssey.flmanbiosci.net
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u4u-engine-frontend
          port: 3000
---
# app.flmanbiosci.net → product host (retire product-mirror hostname).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flmanbiosci-app-redirect
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "app.flmanbiosci.net"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: peptodyssey.flmanbiosci.net
            statusCode: 301
---
# Legacy api.flmanbiosci.net kept as alias → same API (iOS / docs still reference it).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flmanbiosci-api-legacy
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "api.flmanbiosci.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u4u-engine
          port: 8000

---
# Secrets for arete.floridamanweb.online (Arete Tutoring).
#
# Bitwarden Fields item (ClusterSecretStore bitwarden-fields), one custom field
# per env var, named exactly as secretKey below. Every listed field must exist
# on the item or the whole sync fails — set unused placeholders for keys not
# yet wired (OPENAI_API_KEY, CRYPTO_RECEIVE_ADDRESSES, NEURALWATT_API_KEY).
#
# STUDENT HANDOFF: replace remoteRef.key UUID after creating the vault item.
# Do NOT add this file to theswamp/kustomization.yaml until every field exists
# on the Bitwarden item (same gate as external-secret-voice-extra.yaml).
# Ask hwcopeland / vault owner for the item id if you cannot create it.
# Then list this file in kustomization, delete hand-applied Secret, rotate values.
#
# Key list must match Deployment secretKeyRefs (Owner policy replaces the Secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arete-tutoring-secrets
  namespace: theswamp
  labels:
    external-secrets.io/type: webhook
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: arete-tutoring-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        # TODO: Bitwarden Fields item UUID for "arete-tutoring-secrets"
        key: REPLACE_WITH_BW_ITEM_UUID
        property: APP_SECRET
    - secretKey: VOICE_SHARED_SECRET
      remoteRef:
        key: REPLACE_WITH_BW_ITEM_UUID
        property: VOICE_SHARED_SECRET
    - secretKey: CRYPTO_ADMIN_TOKEN
      remoteRef:
        key: REPLACE_WITH_BW_ITEM_UUID
        property: CRYPTO_ADMIN_TOKEN
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: REPLACE_WITH_BW_ITEM_UUID
        property: OPENAI_API_KEY
    - secretKey: CRYPTO_RECEIVE_ADDRESSES
      remoteRef:
        key: REPLACE_WITH_BW_ITEM_UUID
        property: CRYPTO_RECEIVE_ADDRESSES
    - secretKey: NEURALWATT_API_KEY
      remoteRef:
        key: REPLACE_WITH_BW_ITEM_UUID
        property: NEURALWATT_API_KEY

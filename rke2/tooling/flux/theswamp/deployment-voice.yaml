apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  namespace: theswamp
spec:
  replicas: 1 # call state is in-memory; scaling needs redis first
  strategy:
    type: Recreate # RWO volume — old pod must release it first
  selector:
    matchLabels:
      app: voice-agent
  template:
    metadata:
      labels:
        app: voice-agent
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      containers:
        - name: voice-agent
          image: zot.hwcopeland.net/florida-man-bioscience/voice-agent:main@sha256:60179c5db8ccba028d5560656b0b358848d43faa9fbb23ee2d9ceb27b6336c3d # {"$imagepolicy": "tooling:voice-agent"}
          ports:
            - containerPort: 8035
          envFrom:
            - secretRef:
                name: voice-agent-keys
            # Honcho / optional keys not yet on the Bitwarden item (see external-secret-voice).
            - secretRef:
                name: voice-agent-extra
                optional: true
          env:
            - name: PUBLIC_BASE_URL
              value: https://voice.flmanbiosci.net
            # pipeline (Twilio STT -> LLM -> Sesame TTS) or grok-realtime.
            # grok-realtime: xAI handles voice; DeepInfra/Sesame not needed.
            - name: VOICE_BACKEND
              value: grok-realtime
            - name: GROK_VOICE
              value: eve
            - name: OWNER_NAME
              value: Noah
            # Voice image now supports AGENT_MODE=auto — routes per customer registry.
            - name: AGENT_MODE
              value: auto
            - name: SITES_DESK_URL
              value: https://sites.floridamanweb.online
            - name: AI411_PUBLIC_URL
              value: https://ai411.floridamanweb.online
            - name: CUSTOMERS_PATH
              value: /data/customers.json
            - name: BUILDER_BRIEFS_DIR
              value: /data/builder-briefs
            - name: MEMORY_DIR
              value: /data/customer-memory
            - name: CALL_DB
              value: /data/call-log.db
            - name: CORS_ALLOW_ORIGINS
              value: "https://ai411.floridamanweb.online,https://floridamanweb.online,https://www.floridamanweb.online"
            - name: LLM_PROVIDER
              value: anthropic
            - name: CALL_LOG
              value: /data/call-log.csv
            - name: AUDIO_CACHE_DIR
              value: /data/audio_cache
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8035
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8035
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: voice-agent-data

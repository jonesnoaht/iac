---
# HU-rNMP pipeline results browser — Authentik full-proxy.
# Host: hu-rnmp.flmanbiosci.net
# Pattern mirrors site-tracker (httproute-tracker.yaml + providers-sitetracker.yaml).
#
# FMB RBAC: Deployment/Service/PVC in theswamp = FMB can apply.
#            HTTPRoute/DNSRecord/Authentik = Flux/cluster-admin (this PR).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hu-rnmp-browser
  namespace: theswamp
  annotations:
    authentik.home.arpa/enabled: "true"
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "hu-rnmp.flmanbiosci.net"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80

# ---- HTTPRoutes + DNS (need Flux / cluster-admin for apply) ----
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cytogate
  namespace: theswamp
spec:
  parentRefs:
    - { name: hwcopeland-gateway, namespace: kube-system, sectionName: flmanbiosci-https }
  hostnames: ["cytogate.flmanbiosci.net"]
  rules:
    - backendRefs: [{ name: landing-cytogate, port: 80 }]
---
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: cytogate
  namespace: theswamp
spec:
  name: cytogate.flmanbiosci.net
  type: CNAME
  content: flmanbiosci.net
  proxied: true
  ttl: 1
  interval: 5m

---
# Internal site-tracker CRM — Authentik full-proxy.
# Canonical: sites.floridamanweb.online
# Legacy sites.flmanbiosci.net → redirect (httproute-tracker-legacy-redirect.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-tracker
  namespace: theswamp
  annotations:
    authentik.home.arpa/enabled: "true"
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: floridamanweb-https
  hostnames:
    - "sites.floridamanweb.online"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80

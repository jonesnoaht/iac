---
# Public AI 411 landing (phone callback form). NO Authentik — open signup.
# Serves hosting/ai411/index.html baked into the demo-sites image at /ai411/.
# Form posts to https://voice.flmanbiosci.net/api/onboarding/register (CORS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai411-landing
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: floridamanweb-https
  hostnames:
    - "ai411.floridamanweb.online"
  rules:
    # / → /ai411/ so the form is front-and-center on the apex of this host
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ai411/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /ai411
      backendRefs:
        - name: demo-sites
          port: 80
    # Also allow bare paths under host to hit demo-sites (favicon etc.)
    - backendRefs:
        - name: demo-sites
          port: 80

---
# Path-splitting edge in front of u4u frontend+API. Authentik full-proxy
# providers for flmanbiosci.net / app.flmanbiosci.net use this as internal_host
# so one upstream can serve both /api/v1/* and /* (Authentik proxy mode only
# supports a single internal_host).
apiVersion: v1
kind: ConfigMap
metadata:
  name: u4u-edge-nginx
  namespace: theswamp
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        access_log /dev/stdout;
        client_max_body_size 100m;

        upstream u4u_api {
            server u4u-engine.theswamp.svc.cluster.local:8000;
        }
        upstream u4u_fe {
            server u4u-engine-frontend.theswamp.svc.cluster.local:3000;
        }

        server {
            listen 8080;
            server_name _;

            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            location /api/v1/ {
                proxy_pass http://u4u_api/;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_set_header X-authentik-uid      $http_x_authentik_uid;
                proxy_set_header X-authentik-username $http_x_authentik_username;
                proxy_set_header X-authentik-email    $http_x_authentik_email;
                proxy_set_header X-authentik-name     $http_x_authentik_name;
                proxy_set_header X-authentik-groups   $http_x_authentik_groups;
            }

            location = /api/v1 {
                return 308 /api/v1/;
            }

            location / {
                proxy_pass http://u4u_fe;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header X-authentik-uid      $http_x_authentik_uid;
                proxy_set_header X-authentik-username $http_x_authentik_username;
                proxy_set_header X-authentik-email    $http_x_authentik_email;
                proxy_set_header X-authentik-name     $http_x_authentik_name;
                proxy_set_header X-authentik-groups   $http_x_authentik_groups;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: u4u-edge
  namespace: theswamp
  labels:
    app: u4u-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: u4u-edge
  template:
    metadata:
      labels:
        app: u4u-edge
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: conf
          configMap:
            name: u4u-edge-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: u4u-edge
  namespace: theswamp
  labels:
    app: u4u-edge
spec:
  selector:
    app: u4u-edge
  ports:
    - name: http
      port: 80
      targetPort: http

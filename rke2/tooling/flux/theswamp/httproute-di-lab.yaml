---
# Discovery Informatics generic lab jail (empty desk).
# Attaches to *.flmanbiosci.net wildcard. No Authentik in this PR —
# POST /api/v1/turn requires LAB_SHARED_TOKEN. Health is public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: di-lab
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "lab.flmanbiosci.net"
  rules:
    - backendRefs:
        - name: di-lab
          port: 8080
---
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: lab.flmanbiosci.net
  namespace: theswamp
spec:
  name: lab.flmanbiosci.net
  type: CNAME
  content: flmanbiosci.net
  proxied: true
  ttl: 1
  interval: 5m

---
# Optional extras for voice-agent (Honcho, Stripe, email). Same Bitwarden item
# "voice-agent-keys" (uuid below) — add custom fields named exactly as secretKey.
# If a field is missing the whole ExternalSecret fails; keep unused = "unused".
# Until fields exist in BW, apply a one-shot Secret voice-agent-extra in theswamp
# (see docs/PRODUCT_LOOP.md). This manifest is ready for when BW is updated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voice-agent-extra
  namespace: theswamp
  labels:
    external-secrets.io/type: webhook
  annotations:
    # Disabled until Bitwarden custom fields exist — enable by removing this
    # annotation and ensuring every property below is present on the item.
    skip-reconcile: "true"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: voice-agent-extra
    creationPolicy: Owner
  data:
    - secretKey: HONCHO_API_KEY
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: HONCHO_API_KEY
    - secretKey: HONCHO_APP_ID
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: HONCHO_APP_ID
    - secretKey: STRIPE_PAYMENT_LINK_DEFAULT
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: STRIPE_PAYMENT_LINK_DEFAULT
    - secretKey: EMAIL_FROM
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: EMAIL_FROM
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: RESEND_API_KEY

---
# Optional extras for voice-agent (Honcho, Stripe, email). Same Bitwarden item
# "voice-agent-keys" (uuid below) — add custom fields named exactly as secretKey.
# If a field is missing the whole ExternalSecret fails; keep unused = "unused".
#
# GATE: this file is intentionally NOT listed in kustomization.yaml resources,
# so Flux never applies it. That is the real disable switch — External Secrets
# has no skip-reconcile annotation. Until every property exists on the BW item,
# leave it out of kustomization.yaml and keep applying a one-shot Secret
# voice-agent-extra in theswamp by hand (see demo-websites docs/PRODUCT_LOOP.md).
# When BW fields exist: add this file to kustomization.yaml resources.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voice-agent-extra
  namespace: theswamp
  labels:
    external-secrets.io/type: webhook
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: voice-agent-extra
    creationPolicy: Owner
  data:
    - secretKey: HONCHO_API_KEY
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: HONCHO_API_KEY
    - secretKey: HONCHO_APP_ID
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: HONCHO_APP_ID
    - secretKey: STRIPE_PAYMENT_LINK_DEFAULT
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: STRIPE_PAYMENT_LINK_DEFAULT
    - secretKey: EMAIL_FROM
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: EMAIL_FROM
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: f9ca9aff-363f-4f81-a0cb-ab235170f221
        property: RESEND_API_KEY

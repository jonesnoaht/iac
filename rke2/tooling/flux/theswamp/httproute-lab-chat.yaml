---
# Discovery Informatics Open WebUI chat.
# Attaches to *.flmanbiosci.net wildcard. No Authentik.
# Backend Service lab-chat is applied from u4u-engine (not this repo).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-chat
  namespace: theswamp
spec:
  parentRefs:
    - name: hwcopeland-gateway
      namespace: kube-system
      sectionName: flmanbiosci-https
  hostnames:
    - "lab-chat.flmanbiosci.net"
  rules:
    - backendRefs:
        - name: lab-chat
          port: 8080
---
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: lab-chat.flmanbiosci.net
  namespace: theswamp
spec:
  name: lab-chat.flmanbiosci.net
  type: CNAME
  content: flmanbiosci.net
  proxied: true
  ttl: 1
  interval: 5m

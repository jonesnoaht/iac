# sql_exporter domain queries. Rendered into the Secret `sql-exporter-config`
# with the DB password substituted (see README). Metrics keyed on `instrument` (stable
# transport identity) because the `instrument` field bifurcates HPLC/DESKTOP-*.
#
# Detection basis (empirical, 3,602 runs): healthy stroke_amp <=1.0, failures
# 3.3-5.5, EMPTY gap 1.25-3.25 → a flat threshold of 2.0 separates perfectly and
# is method-independent. p_2min is the severity confirmator, not the trigger.
global:
  scrape_timeout: 10s
  min_interval: 30s
target:
  data_source_name: 'postgres://hplc:__PGPASS__@hplc-postgres.freedom.svc:5432/hplc?sslmode=disable'
  collectors: [hplc]
collectors:
  - collector_name: hplc
    metrics:
      - metric_name: hplc_last_stroke_amp
        type: gauge
        help: 'stroke_amp (pump-stroke FFT amplitude) of the most recent run per instrument; >2 = fault'
        key_labels: [instrument]
        values: [stroke_amp]
        query: |
          SELECT DISTINCT ON (instrument) instrument, stroke_amp
          FROM runs WHERE stroke_amp IS NOT NULL ORDER BY instrument, acq_at DESC
      - metric_name: hplc_last_p2min
        type: gauge
        help: 'p_2min (pressure at 2 min) of the most recent run per instrument'
        key_labels: [instrument]
        values: [p_2min]
        query: |
          SELECT DISTINCT ON (instrument) instrument, p_2min
          FROM runs WHERE p_2min IS NOT NULL ORDER BY instrument, acq_at DESC
      - metric_name: hplc_stroke_baseline
        type: gauge
        help: 'median stroke_amp over all ok runs per instrument'
        key_labels: [instrument]
        values: [v]
        query: |
          SELECT instrument, percentile_cont(0.5) WITHIN GROUP (ORDER BY stroke_amp) v
          FROM runs WHERE stroke_amp IS NOT NULL GROUP BY instrument
      - metric_name: hplc_p2min_baseline
        type: gauge
        help: 'median p_2min over all ok runs per instrument'
        key_labels: [instrument]
        values: [v]
        query: |
          SELECT instrument, percentile_cont(0.5) WITHIN GROUP (ORDER BY p_2min) v
          FROM runs WHERE p_2min IS NOT NULL GROUP BY instrument
      - metric_name: hplc_runs_total
        type: gauge
        help: 'parsed runs per instrument'
        key_labels: [instrument]
        values: [n]
        query: 'SELECT instrument, count(*) n FROM runs GROUP BY instrument'
      - metric_name: hplc_last_run_timestamp_seconds
        type: gauge
        help: 'acq_at epoch of newest run per instrument (instrument clock — labeling only, NOT freshness)'
        key_labels: [instrument]
        values: [ts]
        query: |
          SELECT DISTINCT ON (instrument) instrument, extract(epoch FROM acq_at) ts
          FROM runs WHERE acq_at IS NOT NULL ORDER BY instrument, acq_at DESC
      # --- replay-validated drift detectors (see alerting.sql / UPDATES-GOLIVE.md) ---
      - metric_name: hplc_t0_ratio
        type: gauge
        help: 'rolling-median void time (12 runs) vs trailing [-8d,-1d] baseline; >1.10 with p2 low = flow deficit'
        key_labels: [instrument]
        values: [t0_ratio]
        query: 'SELECT instrument, t0_ratio FROM detector_state WHERE t0_ratio IS NOT NULL'
      - metric_name: hplc_p2_ratio
        type: gauge
        help: 'rolling-median p_2min (12 runs) vs trailing [-8d,-1d] baseline'
        key_labels: [instrument]
        values: [p2_ratio]
        query: 'SELECT instrument, p2_ratio FROM detector_state WHERE p2_ratio IS NOT NULL'
      - metric_name: hplc_absent_recent
        type: gauge
        help: 'of the last 5 non-blank runs, how many have main_h < 30000 (no analyte peak); >=4 = analyte absence'
        key_labels: [instrument]
        values: [absent_ct]
        query: 'SELECT instrument, absent_ct FROM detector_state'
      # Materializer: derives features for new runs from chrom_trace so the
      # detector views stay warm. Data-modifying CTE runs at scrape cadence.
      - metric_name: hplc_features_materialized
        type: gauge
        help: 'run_features rows inserted this scrape (from chrom_trace)'
        values: [n]
        query: |
          WITH ins AS (
            INSERT INTO run_features (path, t0_rt, t0_amp, main_rt, main_h, src)
            SELECT path, t0_rt, t0_amp, main_rt, main_h, 'chrom_trace'
            FROM run_features_missing LIMIT 200
            ON CONFLICT (path) DO NOTHING
            RETURNING 1)
          SELECT count(*) n FROM ins
      - metric_name: hplc_parse_errors
        type: gauge
        help: 'files in error state'
        values: [n]
        query: "SELECT count(*) n FROM files WHERE status='error'"
      - metric_name: hplc_backlog_files
        type: gauge
        help: 'files pending parse'
        values: [n]
        query: "SELECT count(*) n FROM files WHERE status='pending'"

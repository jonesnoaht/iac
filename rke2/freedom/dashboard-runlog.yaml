---
# HPLC Run Log — a clean rolling feed of runs. Verdict is the real run health
# (FAULT = pump stroke_amp>2, ERROR = couldn't decode, else OK), NOT the parse
# status. Short time, accession number (not the full path), RUSH/RR as tags.
# Click an accession to open its Run Detail.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hplc-dashboard-runlog
  namespace: freedom
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: HPLC
data:
  hplc-runlog.json: |
    {
      "title": "HPLC Run Log",
      "uid": "hplc-run-log",
      "editable": true,
      "time": {"from": "now-7d", "to": "now"},
      "refresh": "1m",
      "schemaVersion": 39,
      "templating": {"list": [
        {"name": "instrument", "type": "query", "datasource": {"type": "postgres", "uid": "hplc-postgres"},
         "query": "SELECT DISTINCT instrument FROM runs ORDER BY 1", "includeAll": true, "allValue": "%",
         "current": {"text": "All", "value": "$__all"}}
      ]},
      "panels": [
        {"id": 1, "type": "table", "transparent": true,
         "gridPos": {"h": 24, "w": 24, "x": 0, "y": 0},
         "datasource": {"type": "postgres", "uid": "hplc-postgres"},
         "targets": [{"format": "table", "rawSql": "SELECT * FROM (SELECT DISTINCT ON (r.instrument, split_part(substring(r.path from '([^/]+)\\.lcd$'),'_',1), r.acq_at) to_char(r.acq_at,'MM-DD HH24:MI') AS \"ran\", r.instrument, split_part(substring(r.path from '([^/]+)\\.lcd$'),'_',1) AS accession, CASE WHEN f.status='error' THEN 'ERROR' WHEN r.is_fault THEN 'FAULT' ELSE 'OK' END AS verdict, round(r.stroke_amp::numeric,2) AS pump, NULLIF(trim(concat_ws(' ', CASE WHEN r.is_rush THEN 'RUSH' END, CASE WHEN r.is_rerun THEN 'RR' END)),'') AS tags, r.path, r.acq_at AS _t FROM runs r JOIN files f USING(path) WHERE $__timeFilter(r.acq_at) AND r.instrument LIKE '$instrument' ORDER BY r.instrument, split_part(substring(r.path from '([^/]+)\\.lcd$'),'_',1), r.acq_at, r.path) d ORDER BY d._t DESC LIMIT 1000"}],
         "options": {"showHeader": true, "cellHeight": "md", "footer": {"show": false}},
         "fieldConfig": {
           "defaults": {"custom": {"filterable": false, "align": "center", "cellOptions": {"type": "auto"}}},
           "overrides": [
             {"matcher": {"id": "byName", "options": "ran"}, "properties": [
               {"id": "custom.width", "value": 110}]},
             {"matcher": {"id": "byName", "options": "instrument"}, "properties": [
               {"id": "custom.width", "value": 90},
               {"id": "custom.cellOptions", "value": {"type": "color-text"}},
               {"id": "mappings", "value": [{"type": "value", "options": {
                 "helsa": {"color": "purple", "index": 0}, "hope": {"color": "blue", "index": 1}}}]}]},
             {"matcher": {"id": "byName", "options": "accession"}, "properties": [
               {"id": "custom.width", "value": 130},
               {"id": "links", "value": [{"title": "Open run detail", "url": "/d/hplc-run-detail?var-path=${__data.fields.path}"}]}]},
             {"matcher": {"id": "byName", "options": "verdict"}, "properties": [
               {"id": "custom.width", "value": 90},
               {"id": "custom.cellOptions", "value": {"type": "color-text"}}, {"id": "mappings", "value": [{"type": "value", "options": {"OK": {"color": "text", "text": "ok", "index": 0}, "FAULT": {"color": "red", "index": 1}, "ERROR": {"color": "orange", "index": 2}}}]}]},
             {"matcher": {"id": "byName", "options": "pump"}, "properties": [
               {"id": "custom.width", "value": 80},
               {"id": "custom.cellOptions", "value": {"type": "color-text"}},
               {"id": "decimals", "value": 2},
               {"id": "thresholds", "value": {"mode": "absolute", "steps": [
                 {"color": "text", "value": null}, {"color": "orange", "value": 1.5}, {"color": "red", "value": 2}]}}]},
             {"matcher": {"id": "byName", "options": "tags"}, "properties": [
               {"id": "custom.width", "value": 100}, {"id": "custom.align", "value": "right"},
               {"id": "custom.cellOptions", "value": {"type": "color-background"}},
               {"id": "mappings", "value": [
                 {"type": "regex", "options": {"pattern": ".*RR.*", "result": {"color": "#89CFF0", "index": 0}}},
                 {"type": "regex", "options": {"pattern": ".*RUSH.*", "result": {"color": "#F4A259", "index": 1}}},
                 {"type": "special", "options": {"match": "null", "result": {"color": "transparent", "index": 2}}}]}]},
             {"matcher": {"id": "byName", "options": "path"}, "properties": [{"id": "custom.hidden", "value": true}]},
             {"matcher": {"id": "byName", "options": "_t"}, "properties": [{"id": "custom.hidden", "value": true}]}
           ]
         }
        }
      ]
    }

---
# Scrape both freedom exporters. Lives in freedom; the stack's
# serviceMonitorNamespaceSelector is empty (= all namespaces), and the
# release label gets it loaded.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: freedom-exporters
  namespace: freedom
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [freedom]
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [sql-exporter, postgres-exporter] }
  endpoints:
    - { port: metrics, interval: 30s }
---
# HPLC failure detection. severity: critical → existing Alertmanager
# email-operator receiver (→ hampton888@gmail.com). Thresholds are empirical
# (see sql-exporter-config.yaml header): stroke_amp 2.0 sits in the clean
# 1.25-3.25 gap between healthy (<=1) and failed (3.3-5.5) populations.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hplc-detection
  namespace: freedom
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hplc-pump
      rules:
        # Full pump-head failure: pulsation spike AND pressure collapse.
        # This is the signature of the 8/9 and 8/12 Helsa failures.
        - alert: HplcPumpHeadFailure
          expr: hplc_last_stroke_amp > 2 and hplc_last_p2min < 0.8 * hplc_p2min_baseline
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "HPLC pump head FAILURE on {{ $labels.instrument }} (stroke {{ $value | printf \"%.1f\" }})"
            description: >-
              Most recent run on {{ $labels.instrument }} shows pump-stroke amplitude
              {{ with printf "hplc_last_stroke_amp{instrument='%s'}" $labels.instrument | query }}{{ . | first | value | printf "%.1f" }}{{ end }}
              (healthy <1) with pressure collapsed below 80% of baseline — a dead
              pump head. Injections/backpressure unreliable until serviced. This
              is the alert that would have caught the 8/12 failure within 20 min.
        # Developing fault / debris: pulsation elevated but pressure still holding.
        # Caught the run that PRECEDED the 8/9 blowout. Earlier warning.
        - alert: HplcPumpStrokeAnomaly
          expr: hplc_last_stroke_amp > 2 and hplc_last_p2min >= 0.8 * hplc_p2min_baseline
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "HPLC pump stroke anomaly on {{ $labels.instrument }} (developing fault)"
            description: >-
              Elevated pump-stroke amplitude with pressure still normal on
              {{ $labels.instrument }} — a developing head fault / debris event that may
              precede full failure. Inspect before the next batch.
    - name: hplc-drift
      rules:
        # Silent flow deficit (replay-validated 8/14 over 19,540 runs): void time
        # drifting late while pressure sags, no stroke signature. Fired 38 h ahead
        # of hope's 8/13 head failure; 2 false intervals in 8.5 months.
        # for: 60m ≈ 3 runs sustain at the 20-min cadence.
        - alert: HplcFlowDeficit
          expr: hplc_t0_ratio > 1.10 and hplc_p2_ratio < 0.95
          for: 60m
          labels: { severity: warning }
          annotations:
            summary: "HPLC flow deficit on {{ $labels.instrument }} (t0 {{ $value | printf \"%.2f\" }}x late, pressure sagging)"
            description: >-
              Void time on {{ $labels.instrument }} is running >10% late with pressure
              below baseline and normal pump stroke — the silent under-delivery mode
              (check valve/debris or seal). On hope this signature led the 8/13 head
              failure by ~38 h. Purge the pump / inspect check valves before results
              drift past RT tolerance (~1 day at observed rates).
        # Both instruments drifting late together = shared cause (mobile-phase
        # batch), not a pump. Replay: 7/11-12 fired on both systems at once.
        - alert: HplcSystemicShift
          expr: count(hplc_t0_ratio > 1.08) >= 2
          for: 60m
          labels: { severity: warning }
          annotations:
            summary: "HPLC systemic RT shift — multiple instruments drifting together"
            description: >-
              Two or more instruments show simultaneous void-time drift. That is a
              shared-cause event (mobile-phase batch, water quality), not a pump fault.
              Check the most recent mobile-phase prep.
        # Analyte absence: sample runs producing no main peak (empty injections,
        # plumbing errors — e.g. the 8/14 reversed-flow hookup on hope). Validated:
        # only 2 historical streaks in 8.5 months, both real events.
        - alert: HplcAnalyteAbsence
          expr: hplc_absent_recent >= 4
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "HPLC analyte ABSENCE on {{ $labels.instrument }} — runs are empty"
            description: >-
              At least 4 of the last 5 sample runs on {{ $labels.instrument }} have no
              analyte peak (main peak <30k counts; normal is 300k-4M). Injections are
              not reaching the detector — empty vials, autosampler fault, or plumbing
              error. Every affected run needs re-injection once fixed.
    - name: hplc-pipeline
      rules:
        - alert: HplcParseErrors
          expr: hplc_parse_errors > 20
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "HPLC parser error count elevated ({{ $value }})"
            description: "More than 20 .lcd files failed to parse. Some are benign (blank/aborted runs); check if the count is climbing."
        - alert: HplcBacklogStuck
          expr: hplc_backlog_files > 50
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "HPLC parse backlog not draining ({{ $value }} pending)"
            description: "Pending files >50 for 30m — the parser may be stuck or the DB unreachable."
        - alert: HplcExporterDown
          expr: up{job="freedom-exporters"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "HPLC metrics exporter down ({{ $labels.pod }})"
            description: "sql/postgres exporter unreachable >5m — pump-failure detection is blind until it recovers."

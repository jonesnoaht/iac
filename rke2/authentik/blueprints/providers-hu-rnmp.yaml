version: 1
metadata:
  name: HU-rNMP Provider and Application
entries:
# Forward-auth proxy provider for the HU-rNMP pipeline results browser.
# The app has no auth of its own — Authentik guards it and passes
# X-authentik-* identity headers, same pattern as site-tracker.
- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://hu-rnmp.flmanbiosci.net
    internal_host: http://hu-rnmp-browser.theswamp.svc.cluster.local:8050
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for HU-rNMP
  conditions: []
  identifiers:
    name: Provider for HU-rNMP
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present
- attrs:
    meta_launch_url: https://hu-rnmp.flmanbiosci.net
    name: HU-rNMP Pipeline
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for HU-rNMP]]
    slug: hu-rnmp
  conditions: []
  identifiers:
    slug: hu-rnmp
  model: authentik_core.application
  permissions: []
  state: present
# Restrict access to the Florida Man Bioscience group.
- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, hu-rnmp]]
    timeout: 30
  conditions: []
  identifiers: {}
  model: authentik_policies.policybinding
  permissions: []
  state: present

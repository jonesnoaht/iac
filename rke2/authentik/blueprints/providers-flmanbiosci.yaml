version: 1
metadata:
  name: PeptOdyssey Web Proxy Providers
entries:
# =============================================================================
# Full-proxy for PeptOdyssey product web UI at peptodyssey.flmanbiosci.net.
# HTTPRoute → authentik-server → u4u-edge (path-split /api/v1 + frontend).
# Access: Florida Man Bioscience | Infrastructure.
#
# Canonical API shape for FMB products:
#   https://{product-host}/api/v1/...
# Prefer: https://peptodyssey.flmanbiosci.net/api/v1/...
# (same host as the UI — valid TLS under *.flmanbiosci.net; no double subdomain.)
#
# Company apex flmanbiosci.net is PUBLIC (no provider here).
# Legacy dual-routes (no SSO): api.flmanbiosci.net (unprefixed),
#   flmanbiosci.net/api/v1/* (prefix stripped).
#
# Unauthenticated paths on the product host:
#   /privacy and /peptodyssey/privacy  (App Store / TestFlight)
#   /api/v1/health
#   /api/v1/healthkit and /api/v1/healthkit/*  (anchored; backend device token)
#
# flmanbiosci-app provider intentionally ABSENT — app.flmanbiosci.net is a
# gateway 301 to the product host; a second provider with the same
# external_host would make outpost host-matching nondeterministic.
#
# MIRROR into blueprints-configmap.yaml (providers-flmanbiosci.yaml key —
# filename kept so Flux/configmap key stays stable; content is PeptOdyssey web).
# =============================================================================

- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://peptodyssey.flmanbiosci.net
    internal_host: http://u4u-edge.theswamp.svc.cluster.local
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for flmanbiosci
    skip_path_regex: |
      ^/privacy.*
      ^/peptodyssey/privacy.*
      ^/api/v1/health$
      ^/api/v1/healthkit(/|$)
  conditions: []
  identifiers:
    name: Provider for flmanbiosci
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present

- attrs:
    meta_launch_url: https://peptodyssey.flmanbiosci.net
    name: flmanbiosci
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for flmanbiosci]]
    slug: flmanbiosci
  conditions: []
  identifiers:
    slug: flmanbiosci
  model: authentik_core.application
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: a1f0b10c-4c2e-4d8a-9f31-0c5e2b7a91d1
  model: authentik_policies.policybinding
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Infrastructure]]
    order: 10
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: b2e1c20d-5d3f-4e9b-8a42-1d6f3c8b02e2
  model: authentik_policies.policybinding
  permissions: []
  state: present

# Explicitly remove the retired app.flmanbiosci.net duplicate provider/app
# (same external_host as Provider for flmanbiosci — nondeterministic matching).
- attrs: {}
  conditions: []
  identifiers:
    name: Provider for flmanbiosci-app
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: absent

- attrs: {}
  conditions: []
  identifiers:
    slug: flmanbiosci-app
  model: authentik_core.application
  permissions: []
  state: absent

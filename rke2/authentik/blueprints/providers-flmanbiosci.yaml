version: 1
metadata:
  name: Florida Man Bioscience (flmanbiosci) Proxy Providers
entries:
# =============================================================================
# Full-proxy providers for the PeptOdyssey web surface in namespace theswamp.
# Pattern matches site-tracker / Longhorn: HTTPRoute backends authentik-server;
# Authentik authenticates (FMB or Infrastructure group) and proxies to the
# u4u-edge Service, which path-splits /api/v1/* → API and /* → frontend.
#
# Hosts:
#   https://flmanbiosci.net
#   https://app.flmanbiosci.net
#
# api.flmanbiosci.net stays DIRECT to the API (device-token HealthKit + scripts)
# — see theswamp/httproute.yaml. Do not put api.* behind this browser SSO proxy.
#
# Unauthenticated paths (proxy mode matches request PATH):
#   - PeptOdyssey iOS / App Store privacy URL (must stay public HTTP 200)
#   - API health for probes
#   - HealthKit enroll/upload (per-device bearer tokens, not browser SSO)
#
# MIRROR into blueprints-configmap.yaml (providers-flmanbiosci.yaml key).
# =============================================================================

# --- Apex flmanbiosci.net ----------------------------------------------------
- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://flmanbiosci.net
    internal_host: http://u4u-edge.theswamp.svc.cluster.local
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for flmanbiosci
    # Path regexes (Golang). Public privacy + HealthKit + health probes only.
    skip_path_regex: |
      ^/peptodyssey/privacy.*
      ^/api/v1/health$
      ^/api/v1/healthkit.*
  conditions: []
  identifiers:
    name: Provider for flmanbiosci
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present

- attrs:
    meta_launch_url: https://flmanbiosci.net
    name: flmanbiosci
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for flmanbiosci]]
    slug: flmanbiosci
  conditions: []
  identifiers:
    slug: flmanbiosci
  model: authentik_core.application
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: a1f0b10c-4c2e-4d8a-9f31-0c5e2b7a91d1
  model: authentik_policies.policybinding
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Infrastructure]]
    order: 10
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: b2e1c20d-5d3f-4e9b-8a42-1d6f3c8b02e2
  model: authentik_policies.policybinding
  permissions: []
  state: present

# --- app.flmanbiosci.net (same app surface, separate external_host) -----------
- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://app.flmanbiosci.net
    internal_host: http://u4u-edge.theswamp.svc.cluster.local
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for flmanbiosci-app
    skip_path_regex: |
      ^/peptodyssey/privacy.*
      ^/api/v1/health$
      ^/api/v1/healthkit.*
  conditions: []
  identifiers:
    name: Provider for flmanbiosci-app
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present

- attrs:
    meta_launch_url: https://app.flmanbiosci.net
    name: flmanbiosci-app
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for flmanbiosci-app]]
    slug: flmanbiosci-app
  conditions: []
  identifiers:
    slug: flmanbiosci-app
  model: authentik_core.application
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, flmanbiosci-app]]
    timeout: 30
  conditions: []
  identifiers:
    pk: c3d2e30e-6e40-4fab-9b53-2e704d9c13f3
  model: authentik_policies.policybinding
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Infrastructure]]
    order: 10
    target: !Find [authentik_core.application, [slug, flmanbiosci-app]]
    timeout: 30
  conditions: []
  identifiers:
    pk: d4e3f40f-7f51-40bc-ac64-3f815e0d24a4
  model: authentik_policies.policybinding
  permissions: []
  state: present

version: 1
metadata:
  name: PeptOdyssey Web Proxy Providers
entries:
# =============================================================================
# Full-proxy for PeptOdyssey product web UI at peptodyssey.flmanbiosci.net.
# HTTPRoute → authentik-server → u4u-edge (path-split /api/v1 + frontend).
# Access: Florida Man Bioscience | Infrastructure.
#
# Company apex flmanbiosci.net is PUBLIC (no provider here).
# API: api.peptodyssey.flmanbiosci.net (+ legacy api.flmanbiosci.net) DIRECT.
#
# Unauthenticated paths on the product host:
#   /privacy and /peptodyssey/privacy  (App Store / TestFlight)
#   /api/v1/health
#   /api/v1/healthkit/*
#
# MIRROR into blueprints-configmap.yaml (providers-flmanbiosci.yaml key —
# filename kept so Flux/configmap key stays stable; content is PeptOdyssey web).
# =============================================================================

- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://peptodyssey.flmanbiosci.net
    internal_host: http://u4u-edge.theswamp.svc.cluster.local
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for flmanbiosci
    skip_path_regex: |
      ^/privacy.*
      ^/peptodyssey/privacy.*
      ^/api/v1/health$
      ^/api/v1/healthkit.*
  conditions: []
  identifiers:
    name: Provider for flmanbiosci
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present

- attrs:
    meta_launch_url: https://peptodyssey.flmanbiosci.net
    name: flmanbiosci
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for flmanbiosci]]
    slug: flmanbiosci
  conditions: []
  identifiers:
    slug: flmanbiosci
  model: authentik_core.application
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: a1f0b10c-4c2e-4d8a-9f31-0c5e2b7a91d1
  model: authentik_policies.policybinding
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Infrastructure]]
    order: 10
    target: !Find [authentik_core.application, [slug, flmanbiosci]]
    timeout: 30
  conditions: []
  identifiers:
    pk: b2e1c20d-5d3f-4e9b-8a42-1d6f3c8b02e2
  model: authentik_policies.policybinding
  permissions: []
  state: present

# Retire app.flmanbiosci.net provider (hostname now 301s to product).
# Keep object absent-safe: disable bindings by pointing external_host at the
# product host under a distinct name and leave slug flmanbiosci-app as redirect
# documentation only — HTTPRoute no longer sends traffic here.
- attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    external_host: https://peptodyssey.flmanbiosci.net
    internal_host: http://u4u-edge.theswamp.svc.cluster.local
    internal_host_ssl_validation: false
    mode: proxy
    name: Provider for flmanbiosci-app
    skip_path_regex: |
      ^/privacy.*
      ^/peptodyssey/privacy.*
      ^/api/v1/health$
      ^/api/v1/healthkit.*
  conditions: []
  identifiers:
    name: Provider for flmanbiosci-app
  model: authentik_providers_proxy.proxyprovider
  permissions: []
  state: present

- attrs:
    meta_launch_url: https://peptodyssey.flmanbiosci.net
    name: flmanbiosci-app
    policy_engine_mode: any
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for flmanbiosci-app]]
    slug: flmanbiosci-app
  conditions: []
  identifiers:
    slug: flmanbiosci-app
  model: authentik_core.application
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Florida Man Bioscience]]
    order: 0
    target: !Find [authentik_core.application, [slug, flmanbiosci-app]]
    timeout: 30
  conditions: []
  identifiers:
    pk: c3d2e30e-6e40-4fab-9b53-2e704d9c13f3
  model: authentik_policies.policybinding
  permissions: []
  state: present

- attrs:
    enabled: true
    group: !Find [authentik_core.group, [name, Infrastructure]]
    order: 10
    target: !Find [authentik_core.application, [slug, flmanbiosci-app]]
    timeout: 30
  conditions: []
  identifiers:
    pk: d4e3f40f-7f51-40bc-ac64-3f815e0d24a4
  model: authentik_policies.policybinding
  permissions: []
  state: present
